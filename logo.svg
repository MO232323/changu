<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- Circular logo mark -->
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BFF642;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7BCB2A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="40" cy="40" r="36" fill="none" stroke="url(#greenGrad)" stroke-width="4"/>
  <!-- Inner circle fill -->
  <circle cx="40" cy="40" r="30" fill="#0d1a12"/>
  <!-- CM letters -->
  <text x="40" y="48" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle">CM</text>
  <!-- Play / arrow triangle -->
  <polygon points="58,28 58,52 78,40" fill="url(#greenGrad)"/>
  <!-- Company name -->
  <text x="95" y="38" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="white">Changu</text>
  <text x="95" y="62" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#BFF642">Media and Tech</text>
</svg>
